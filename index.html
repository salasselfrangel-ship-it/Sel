<script type="text/x-python" id="pysrc">
import json, re
from collections import Counter
import sympy as sp
from sympy.parsing.sympy_parser import parse_expr, standard_transformations, implicit_multiplication_application, convert_xor
from sympy.integrals.manualintegrate import integral_steps

TR = standard_transformations + (implicit_multiplication_application, convert_xor)
x, y, z, t = sp.symbols('x y z t')
Y = sp.Function('y')(x)
L = sp.latex
ENV = {'e': sp.E, 'ln': sp.log, 'log': lambda a, b=10: sp.log(a, b), 'sen': sp.sin, 'tg': sp.tan,
       'arcsin': sp.asin, 'arccos': sp.acos, 'arctan': sp.atan, 'abs': sp.Abs,
       'nCr': sp.binomial, 'nPr': lambda a, b: sp.factorial(a) / sp.factorial(a - b), 'Matrix': sp.Matrix}
S, R, PLOT = [], [], None

def add(txt, m=''): S.append([txt, m])

def P(s, ev=True, extra=None):
    s = s.strip().replace('π', 'pi').replace('∞', 'oo').replace('×', '*').replace('÷', '/').replace('−', '-')
    s = s.replace('°', '*pi/180').replace('²', '**2').replace('³', '**3')
    s = re.sub(r'√\s*(\d+\.?\d*|[A-Za-z]+)', r'sqrt(\1)', s).replace('√', 'sqrt')
    d = dict(ENV)
    if extra: d.update(extra)
    return parse_expr(s, transformations=TR, local_dict=d, evaluate=ev)

def split(s):
    out, d, cur = [], 0, ''
    for c in s:
        if c in '([{': d += 1
        if c in ')]}': d -= 1
        if c == ',' and d == 0: out.append(cur); cur = ''
        else: cur += c
    out.append(cur)
    return [o.strip() for o in out if o.strip()]

def var_of(f, a=None):
    if a: return P(a)
    fs = sorted(f.free_symbols, key=str)
    return fs[0] if fs else x

# ---------- Calcular ----------
def layer(e):
    if e.is_Atom: return e
    if all(a.is_Atom for a in e.args): return e.func(*e.args)
    return e.func(*[layer(a) for a in e.args], evaluate=False)

def m_calc(s):
    e = P(s, ev=False)
    add('Expresión', L(e))
    cur = e
    try:
        if not e.free_symbols:
            for _ in range(8):
                nxt = layer(cur)
                if nxt == cur or cur.is_Atom: break
                add('Resolvemos primero lo más interno (respetando la jerarquía)', L(nxt)); cur = nxt
    except Exception: pass
    v = sp.simplify(P(s))
    R.append(['Resultado exacto', L(v)])
    if not v.free_symbols and not v.is_Integer:
        R.append(['Aproximación decimal', L(sp.N(v, 15))])

# ---------- Álgebra ----------
def m_alg(s):
    e = P(s); add('Expresión', L(e)); seen = {e}
    for name, f in (('Simplificada', sp.simplify), ('Expandida', sp.expand), ('Factorizada', sp.factor), ('Fracciones parciales', sp.apart), ('Trigonométrica simplificada', sp.trigsimp)):
        try: r = f(e)
        except Exception: continue
        if r not in seen: seen.add(r); R.append([name, L(r)])
    if not R: R.append(['La expresión ya está en su forma más simple', L(e)])
    if e.free_symbols and e.is_polynomial():
        v = var_of(e); add('Raíces del polinomio', L(sp.roots(sp.Poly(e, v))))

# ---------- Resolver ----------
def m_solve(s):
    parts = [p for p in s.split(';') if p.strip()]
    if len(parts) == 1 and re.search(r'<=|>=|<|>', parts[0]): return ineq(parts[0])
    eqs = []
    for p in parts:
        a, b = p.split('=') if '=' in p else (p, '0')
        eqs.append(sp.Eq(P(a), P(b)))
    vs = sorted(set().union(*[q.free_symbols for q in eqs]), key=str)
    if len(eqs) == 1 and len(vs) == 1:
        v = vs[0]; q = eqs[0]; f = sp.expand(q.lhs - q.rhs)
        add('Ecuación', L(q)); add('Pasamos todo a un lado', L(f) + '=0')
        if f.is_polynomial(v):
            if sp.degree(f, v) == 2:
                a, b, c = sp.Poly(f, v).all_coeffs()
                add('Cuadrática: a = %s, b = %s, c = %s' % (a, b, c))
                add('Discriminante', r'\Delta=b^2-4ac=' + L(sp.simplify(b**2 - 4*a*c)))
                add('Fórmula general', r'x=\frac{-b\pm\sqrt{\Delta}}{2a}')
            fa = sp.factor(f)
            if fa != f: add('Factorizamos; cada factor igual a cero da una solución', L(fa) + '=0')
        sols = sp.solve(f, v)
        if not sols: R.append(['Resultado', r'\text{Sin solución}'])
        for sv in sols:
            R.append([L(v) + ' =', L(sv) + ((r'\approx ' + L(sp.N(sv, 8))) if not sv.is_Rational and sv.is_number else '')])
            add('Comprobación', L(v) + '=' + L(sv) + r'\Rightarrow ' + L(sp.simplify(f.subs(v, sv))) + '=0')
    else:
        add('Sistema', r'\begin{cases}' + r'\\'.join(L(q) for q in eqs) + r'\end{cases}')
        try:
            A, bb = sp.linear_eq_to_matrix([q.lhs - q.rhs for q in eqs], vs)
            add('Forma matricial A·x = b', L(A) + L(sp.Matrix(vs)) + '=' + L(-bb))
            add('Eliminación de Gauss-Jordan sobre [A | b]', L(sp.Matrix.hstack(A, -bb).rref()[0]))
        except Exception: add('Sistema no lineal: se resuelve por sustitución algebraica')
        sol = sp.solve(eqs, vs, dict=True)
        if not sol: R.append(['Resultado', r'\text{Sin solución}'])
        for d in sol: R.append(['Solución', ',\\;'.join(L(k) + '=' + L(v) for k, v in d.items())])

def ineq(p):
    rel = P(p); v = var_of(rel)
    add('Desigualdad', L(rel))
    add('Puntos críticos (donde la expresión vale 0)', L(sp.solve(sp.Eq(rel.lhs - rel.rhs, 0), v)))
    R.append(['Solución', L(sp.solve_univariate_inequality(rel, v, relational=False))])

# ---------- Derivar ----------
def dstep(e, v, dp=0):
    D = lambda u: r'\frac{d}{d%s}\left(%s\right)' % (L(v), L(u))
    if dp > 2 or e.is_Atom or not e.has(v):
        if e.is_Atom and e.has(v): add('Derivada básica', D(e) + '=' + L(sp.diff(e, v)))
        return
    if e.is_Add:
        add('Regla de la suma: derivamos término a término', D(e) + '=' + '+'.join(D(a) for a in e.args))
        for a in e.args: dstep(a, v, dp + 1)
    elif e.is_Mul:
        num, den = sp.fraction(e)
        c, rest = e.as_independent(v)
        if c != 1:
            add('La constante %s sale de la derivada' % L(c), D(e) + '=' + L(c) + r'\cdot' + D(rest)); dstep(rest, v, dp + 1)
        elif den != 1 and den.has(v):
            add('Regla del cociente: (u/v)′ = (u′v − uv′)/v²', 'u=' + L(num) + r',\;v=' + L(den) + r'\;\Rightarrow\;\frac{(%s)(%s)-(%s)(%s)}{(%s)^2}' % (L(sp.diff(num, v)), L(den), L(num), L(sp.diff(den, v)), L(den)))
            dstep(num, v, dp + 1); dstep(den, v, dp + 1)
        else:
            u = e.args[0]; w = sp.Mul(*e.args[1:])
            add('Regla del producto: (u·v)′ = u′v + uv′', 'u=' + L(u) + r',\;v=' + L(w) + r'\;\Rightarrow\;(' + L(sp.diff(u, v)) + r')(' + L(w) + r')+(' + L(u) + r')(' + L(sp.diff(w, v)) + ')')
            dstep(u, v, dp + 1); dstep(w, v, dp + 1)
    elif e.is_Pow:
        b, p = e.args
        if not p.has(v) and b == v: add('Regla de la potencia: (xⁿ)′ = n·xⁿ⁻¹', D(e) + '=' + L(sp.diff(e, v)))
        elif not p.has(v):
            add('Regla de la cadena con potencia: (uⁿ)′ = n·uⁿ⁻¹·u′', 'u=' + L(b) + r'\;\Rightarrow\;' + L(sp.diff(e, v))); dstep(b, v, dp + 1)
        else: add('Exponencial o potencia general', D(e) + '=' + L(sp.diff(e, v)))
    else:
        g = e.args[0]
        if g == v: add('Derivada de función elemental', D(e) + '=' + L(sp.diff(e, v)))
        else:
            add('Regla de la cadena: (f∘g)′ = f′(g)·g′', 'g=' + L(g) + r'\;\Rightarrow\;' + L(sp.diff(e, v))); dstep(g, v, dp + 1)

def m_diff(s):
    a = split(s); f = P(a[0]); v = var_of(f, a[1] if len(a) > 1 else None); k = int(a[2]) if len(a) > 2 else 1
    add('Función', 'f=' + L(f))
    if k == 1: dstep(f, v)
    else: add('Derivamos %d veces respecto a %s' % (k, v))
    r = sp.diff(f, v, k)
    add('Simplificamos', L(sp.simplify(r)))
    R.append(['Derivada', L(sp.Derivative(f, (v, k))) + '=' + L(sp.simplify(r))])

# ---------- Integrar ----------
NM = {'ConstantRule': 'Integral de una constante', 'PowerRule': 'Regla de la potencia', 'AddRule': 'Regla de la suma', 'ConstantTimesRule': 'Sacamos la constante',
      'URule': 'Sustitución', 'PartsRule': 'Integración por partes', 'TrigRule': 'Integral trigonométrica', 'ExpRule': 'Integral exponencial',
      'ReciprocalRule': 'Integral de 1/x', 'ArctanRule': 'Integral que da arcotangente', 'RewriteRule': 'Reescribimos el integrando',
      'CyclicPartsRule': 'Partes cíclicas', 'DontKnowRule': 'Sin regla elemental directa'}

def walk(r, dp=0):
    if dp > 6: return
    n = type(r).__name__
    if n == 'AlternativeRule': return walk(r.alternatives[0], dp + 1)
    ctx = getattr(r, 'context', None); m = ''
    if ctx is not None: m = r'\int ' + L(ctx) + r'\,d' + L(r.symbol)
    if n == 'URule': m += r'\;\;\;u=' + L(r.u_func)
    if n == 'PartsRule': m += r'\;\;\;u=' + L(r.u) + r',\;dv=' + L(r.dv)
    if n == 'RewriteRule': m += '=' + r'\int ' + L(r.rewritten) + r'\,d' + L(r.symbol)
    add(NM.get(n, n), m)
    for at in ('substep', 'v_step', 'second_step'):
        w = getattr(r, at, None)
        if w is not None: walk(w, dp + 1)
    for w in (getattr(r, 'substeps', None) or []): walk(w, dp + 1)

def m_int(s):
    a = split(s); f = P(a[0]); v = var_of(f, a[1] if len(a) > 1 else None)
    add('Integral', r'\int ' + L(f) + r'\,d' + L(v))
    try: walk(integral_steps(f, v))
    except Exception: add('Se resuelve con el motor simbólico')
    F = sp.integrate(f, v)
    if len(a) > 3:
        lo, hi = P(a[2]), P(a[3])
        add('Antiderivada F', L(F))
        add('Teorema fundamental: F(b) − F(a)', L(F.subs(v, hi)) + '-\\left(' + L(F.subs(v, lo)) + r'\right)')
        val = sp.simplify(F.subs(v, hi) - F.subs(v, lo))
        R.append(['Integral definida', L(sp.Integral(f, (v, lo, hi))) + '=' + L(val) + (r'\approx ' + L(sp.N(val, 10)) if not val.is_Rational else '')])
    else:
        R.append(['Antiderivada', L(F) + '+C'])

# ---------- Límite ----------
def m_lim(s):
    a = split(s); f = P(a[0]); lhs, rhs = re.split('->|→', a[1]); v = P(lhs); pt = P(rhs)
    dr = a[2] if len(a) > 2 and a[2] in '+-' else '+-'
    add('Límite', L(sp.Limit(f, v, pt, dr)))
    try: dv = f.subs(v, pt)
    except Exception: dv = sp.nan
    if dv.is_finite is True: add('Sustitución directa', L(dv))
    else:
        add('La sustitución directa da una forma indeterminada o infinita')
        sf = sp.simplify(f)
        if sf != f: add('Simplificamos', L(sf))
        num, den = sp.fraction(sp.together(f))
        try:
            if den != 1 and sp.limit(num, v, pt) == 0 and sp.limit(den, v, pt) == 0:
                add("Forma 0/0: regla de L'Hôpital", r'\lim\frac{%s}{%s}' % (L(sp.diff(num, v)), L(sp.diff(den, v))))
        except Exception: pass
    R.append(['Resultado', L(sp.Limit(f, v, pt, dr)) + '=' + L(sp.limit(f, v, pt, dr))])

# ---------- Series de Taylor ----------
def m_ser(s):
    a = split(s); f = P(a[0]); v = var_of(f, a[1] if len(a) > 1 else None)
    p = P(a[2]) if len(a) > 2 else sp.Integer(0); N = int(a[3]) if len(a) > 3 else 6
    add('Fórmula de Taylor', r'f(x)=\sum_{k\ge0}\frac{f^{(k)}(a)}{k!}(x-a)^k')
    for k in range(min(N, 6)):
        add('Término k = %d' % k, r'\frac{f^{(%d)}(%s)}{%d!}=%s' % (k, L(p), k, L(sp.simplify(sp.diff(f, v, k).subs(v, p) / sp.factorial(k)))))
    R.append(['Serie', L(sp.series(f, v, p, N))])

# ---------- Ecuaciones diferenciales ----------
def m_ode(s):
    s = s.replace("y''", 'DD').replace("y'", 'D1')
    a, b = s.split('=') if '=' in s else (s, '0')
    env = {'DD': sp.Derivative(Y, (x, 2)), 'D1': sp.Derivative(Y, x), 'y': Y}
    eq = sp.Eq(P(a, extra=env), P(b, extra=env))
    add('Ecuación diferencial', L(eq))
    try: add('Tipo (pistas de clasificación): ' + ', '.join(sp.classify_ode(eq, Y)[:3]))
    except Exception: pass
    R.append(['Solución general', L(sp.dsolve(eq, Y))])

# ---------- Matrices ----------
def m_mat(s):
    M = P(s.replace('[[', 'Matrix([[').replace(']]', ']])'))
    if not isinstance(M, sp.MatrixBase): R.append(['Resultado', L(M)]); return
    add('Matriz', L(M)); R.append(['Resultado', L(M)])
    R.append(['Transpuesta', L(M.T)]); R.append(['Rango', str(M.rank())])
    if M.is_square:
        n = M.shape[0]; d = M.det()
        if n == 2: add('Determinante 2×2: ad − bc', r'%s\cdot%s-%s\cdot%s=%s' % (L(M[0, 0]), L(M[1, 1]), L(M[0, 1]), L(M[1, 0]), L(d)))
        else: add('Determinante por cofactores (1.ª fila)', '+'.join(r'\left(%s\right)\left(%s\right)' % (L(M[0, j]), L(M.cofactor(0, j))) for j in range(n)) + '=' + L(d))
        R.append(['Determinante', L(d)]); R.append(['Traza', L(M.trace())])
        if d != 0:
            add('Inversa = adj(A) / det(A)', L(M.adjugate()) + r'\Big/\,' + L(d)); R.append(['Inversa', L(M.inv())])
        try:
            lam = sp.Symbol('lambda')
            add('Polinomio característico det(A − λI)', L(sp.factor((M - lam * sp.eye(n)).det())) + '=0')
            R.append(['Autovalores', ',\\;'.join(L(k) + r'\;(\times%d)' % v for k, v in M.eigenvals().items())])
        except Exception: pass

# ---------- Teoría de números ----------
def m_num(s):
    a = [int(P(q)) for q in split(s)]
    if len(a) == 1:
        n = a[0]; m = n; p = 2
        add('Dividimos entre primos sucesivos', '')
        while n < 10**12 and p * p <= m:
            while m % p == 0: add('%d ÷ %d = %d' % (m, p, m // p)); m //= p
            p += 1
        if 1 < m < n: add('%d es primo' % m)
        f = sp.factorint(n)
        R.append(['Factorización', L(n) + '=' + r'\cdot '.join(L(sp.Pow(k, v, evaluate=False)) for k, v in f.items())])
        R.append(['¿Es primo?', 'Sí' if sp.isprime(n) else 'No'])
        if n < 10**7: R.append(['Divisores', L(sp.divisors(n))])
        R.append(['φ de Euler', str(sp.totient(n))])
    else:
        p, q = a[0], a[1]; g0, l0 = p, q
        add('Algoritmo de Euclides')
        while q:
            add('%d = %d·%d + %d' % (p, p // q, q, p % q)); p, q = q, p % q
        R.append(['mcd', str(p)]); R.append(['mcm', str(abs(g0 * l0) // p)])

# ---------- Estadística ----------
def m_stat(s):
    global R
    d = [P(q) for q in split(s)]; N = len(d)
    add('Datos', L(d))
    sm = sum(d); mu = sp.nsimplify(sm / N)
    add('Media = Σx / n', L(sm) + '/' + str(N) + '=' + L(mu))
    ss = sp.simplify(sum((v - mu)**2 for v in d)); add('Suma de cuadrados Σ(xᵢ − x̄)²', L(ss))
    sd = sorted(d); med = sd[N // 2] if N % 2 else (sd[N // 2 - 1] + sd[N // 2]) / 2
    c = Counter(d).most_common(); mx = [k for k, v in c if v == c[0][1]]
    R += [['Media', L(mu)], ['Mediana', L(med)], ['Moda', L(mx) if c[0][1] > 1 else r'\text{sin moda}'], ['Mínimo / Máximo', L(sd[0]) + r'\;/\;' + L(sd[-1])],
          ['Varianza poblacional', L(sp.simplify(ss / N))], ['Desviación estándar poblacional', L(sp.sqrt(ss / N)) + r'\approx ' + L(sp.N(sp.sqrt(ss / N), 8))]]
    if N > 1: R += [['Varianza muestral', L(sp.simplify(ss / (N - 1)))], ['Desviación estándar muestral', L(sp.sqrt(ss / (N - 1))) + r'\approx ' + L(sp.N(sp.sqrt(ss / (N - 1)), 8))]]

# ---------- Gráfica ----------
def m_plot(s):
    global PLOT
    lo, hi = -10.0, 10.0
    r = re.search(r'\[\s*([-\d.eE]+)\s*,\s*([-\d.eE]+)\s*\]\s*$', s)
    if r: lo, hi = float(r.group(1)), float(r.group(2)); s = s[:r.start()]
    cs = []

def e_eq(d):

  ['num','Números','360','Un entero: factorización. Dos enteros (a, b): mcd y mcm con Euclides.',['360','84, 36','97']],

  ['plot','Gráfica','sin(x); x^2/10 [-6.28, 6.28]','Una o varias funciones separadas por ; y rango opcional [xmin, xmax]',['sin(x); x^2/10 [-6.28, 6.28]','x^3 - 3x [-3, 3]','1/x; tan(x) [-6, 6]']],
  ['fin','Finanzas','vf: c=1000000, i=2%, n=12','Formato  comando: dato=valor, …  Comandos: vf, vp, simple, n, i, ea, nom, cuota, vfa, vpa, amort (sis=f francés / a alemán), van, tir, payback, dep. Las tasas se escriben con %.',['vf: c=1000000, i=2%, n=12','cuota: vp=20000000, i=1.5%, n=36','amort: vp=5000000, i=2%, n=6','van: i=10%, flujos=[-1000, 300, 400, 500]','tir: flujos=[-1000, 300, 400, 500]','ea: j=24%, m=12','dep: costo=10000, residuo=1000, vida=5']],
  ['eco','Economía','equilibrio: d=100-2*P, o=-20+4*P','Comandos: equilibrio, elasticidad, arco, costos, beneficio, crec, infl, real, mult, util. Usa P para el precio y q para la cantidad.',['equilibrio: d=100-2*P, o=-20+4*P','elasticidad: d=100-2*P, p=20','arco: p1=10, q1=80, p2=12, q2=70','costos: ct=1000+5*q+0.1*q^2','beneficio: it=50*q, ct=1000+5*q+0.1*q^2','util: u=x^(1/2)*y^(1/2), px=2, py=4, m=100','crec: x0=100, x1=150, n=5','mult: pmc=0.8']],
  ['neg','Negocios','pe: cf=5000, p=25, cv=15','Comandos: pe, roi, margen, iva (19 % por defecto), desc, eoq, rop, razones, reg, movil.',['pe: cf=5000, p=25, cv=15','eoq: d=1200, s=50, h=2','reg: x=[1,2,3,4,5], y=[2.1,3.9,6.2,7.8,10.1], xp=6','movil: d=[10,12,13,12,15,16], k=3','razones: ac=500, pc=300, inv=120, pasivo=400, activo=1000, patr=600, un=90, ventas=1500','iva: base=100000, tasa=19%','roi: gan=30000, inv=200000','margen: costo=60, precio=100']]

const KEYS = [
 ['7','7','num'],['8','8','num'],['9','9','num'],['÷','/','op'],['(','(','vr'],[')',')','vr'],
 ['4','4','num'],['5','5','num'],['6','6','num'],['×','*','op'],['x','x','vr'],['y','y','vr'],
 ['1','1','num'],['2','2','num'],['3','3','num'],['−','-','op'],['π','π','vr'],['e','e','vr'],
 ['0','0','num'],['.','.','num'],['^','^','op'],['+','+','op'],['√','√(','fn'],[',',', ','vr'],
 ['sin','sin(','fn'],['cos','cos(','fn'],['tan','tan(','fn'],['ln','ln(','fn'],['log','log(','fn'],['abs','abs(','fn'],
 ['asin','asin(','fn'],['acos','acos(','fn'],['atan','atan(','fn'],['∞','∞','vr'],['⌫','@bs','ct'],['AC','@ac','ct'],
 ['%','%','vr'],['=','=','vr'],[':',': ','vr'],['[','[','vr'],[']',']','vr'],['P','P','vr']
];
let mode = 'calc', py = null, ready = false; const hist = [];
const inp = $('inp');

KEYS.forEach(([l, v, c]) => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = l; b.className = 'k ' + c;
  b.onclick = () => {
    if (v === '@ac') inp.value = '';
    else if (v === '@bs'){ const p = inp.selectionStart; if (p > 0){ inp.value = inp.value.slice(0, p - 1) + inp.value.slice(inp.selectionEnd); inp.setSelectionRange(p - 1, p - 1); } }
    else { const p = inp.selectionStart; inp.value = inp.value.slice(0, p) + v + inp.value.slice(inp.selectionEnd); inp.setSelectionRange(p + v.length, p + v.length); }
    inp.focus();
  };
  $('keys').appendChild(b);
});
$('kp').open = matchMedia('(min-width:1024px)').matches;

function setMode(m){
  mode = m; const d = MODES.find(x => x[0] === m);
  document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('on', t.dataset.m === m));
  inp.placeholder = d[2]; $('hint').textContent = d[3]; $('exs').innerHTML = '';
  d[4].forEach(e => { const s = document.createElement('button'); s.className = 'ex mono'; s.textContent = e; s.onclick = () => { inp.value = e; inp.focus(); }; $('exs').appendChild(s); });
}
MODES.forEach(d => { const b = document.createElement('button'); b.className = 'tab'; b.dataset.m = d[0]; b.textContent = d[1]; b.onclick = () => setMode(d[0]); $('tabs').appendChild(b); });
setMode('calc');

const tex = (el, m) => { try { katex.render(m, el, { displayMode: true, throwOnError: false }); } catch (e) { el.textContent = m; } };

function show(d){
  const out = $('out'); out.innerHTML = '';
  if (d.err){ out.innerHTML = '<div class="card p-5 border-rose-300 bg-rose-50 text-rose-800 text-sm"></div>'; out.firstChild.textContent = d.err; return; }
  d.r.forEach(([lab, m]) => {
    const c = document.createElement('div'); c.className = 'card p-5 border-l-4 border-l-emerald-700';
    c.innerHTML = '<div class="text-xs font-semibold text-emerald-800 mb-1"></div><div class="res text-xl"></div>'; c.firstChild.textContent = lab;
    tex(c.lastChild, m); out.appendChild(c);
  });
  if (d.p) plot(d.p, out);
  if (d.s.length){
    const c = document.createElement('div'); c.className = 'card p-5';
    c.innerHTML = '<h2 class="font-bold text-[#1f3a5f] mb-2">Procedimiento</h2>';
    d.s.forEach(([t, m], i) => {
      const s = document.createElement('div'); s.className = 'step mb-3';
      s.innerHTML = '<div class="text-sm text-slate-700"></div><div class="m"></div>'; s.firstChild.textContent = (i + 1) + '. ' + t;
      if (m) tex(s.lastChild, m); c.appendChild(s);
    });
    out.appendChild(c);
  }
}

function plot(p, out){
  const wrap = document.createElement('div'); wrap.className = 'card p-3'; const cv = document.createElement('canvas');
  cv.style.cssText = 'width:100%;height:320px;display:block'; wrap.appendChild(cv); out.appendChild(wrap);
  const dpr = devicePixelRatio || 1, W = cv.width = cv.clientWidth * dpr, H = cv.height = 320 * dpr, g = cv.getContext('2d');
  const ys = p.c.flatMap(c => c.p.map(q => q[1]).filter(v => v !== null && Math.abs(v) < 1e4)).sort((a, b) => a - b);
  let y0 = ys.length ? ys[Math.floor(ys.length * .02)] : -1, y1 = ys.length ? ys[Math.floor(ys.length * .98)] : 1;
  if (y1 - y0 < 1e-9){ y0 -= 1; y1 += 1; } const pad = (y1 - y0) * .1; y0 -= pad; y1 += pad;
  const X = v => (v - p.lo) / (p.hi - p.lo) * W, Y = v => H - (v - y0) / (y1 - y0) * H;
  const nice = r => { const s = Math.pow(10, Math.floor(Math.log10(r / 5))); const m = r / 5 / s; return s * (m < 2 ? 1 : m < 5 ? 2 : 5); };
  g.font = (11 * dpr) + 'px system-ui'; g.fillStyle = '#64748b'; g.lineWidth = 1;
  const sx = nice(p.hi - p.lo), sy = nice(y1 - y0);
  for (let v = Math.ceil(p.lo / sx) * sx; v <= p.hi; v += sx){ g.strokeStyle = '#e2e8f0'; g.beginPath(); g.moveTo(X(v), 0); g.lineTo(X(v), H); g.stroke(); g.fillText(+v.toFixed(4), X(v) + 3, Math.min(H - 4, Math.max(12, Y(0) - 4))); }
  for (let v = Math.ceil(y0 / sy) * sy; v <= y1; v += sy){ g.strokeStyle = '#e2e8f0'; g.beginPath(); g.moveTo(0, Y(v)); g.lineTo(W, Y(v)); g.stroke(); g.fillText(+v.toFixed(4), 4, Y(v) - 3); }
  g.strokeStyle = '#1b2433'; g.lineWidth = 1.5 * dpr; g.beginPath(); g.moveTo(X(0), 0); g.lineTo(X(0), H); g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); g.stroke();
  const col = ['#c2410c', '#1d4ed8', '#15803d', '#7e22ce', '#be123c'];
  p.c.forEach((c, i) => {
    g.strokeStyle = col[i % 5]; g.lineWidth = 2.2 * dpr; g.beginPath(); let pen = false;
    c.p.forEach(([a, b]) => { if (b === null || b < y0 - (y1 - y0) || b > y1 + (y1 - y0)){ pen = false; return; } pen ? g.lineTo(X(a), Y(b)) : g.moveTo(X(a), Y(b)); pen = true; });
    g.stroke(); g.fillStyle = col[i % 5]; g.font = (12 * dpr) + 'px system-ui'; g.fillText('f' + (i + 1) + ' = ' + c.l, 10 * dpr, (18 + i * 16) * dpr);
  });
}

async function go(){
  const text = inp.value.trim(); if (!ready || !text) return;
  $('goBtn').disabled = true; $('out').innerHTML = '<div class="card p-5 text-slate-500 text-sm">Calculando…</div>';
  await new Promise(r => setTimeout(r, 30));
  let d; try { d = JSON.parse(py.globals.get('run')(mode, text)); } catch (e) { d = { err: String(e).slice(0, 160) }; }
  show(d); $('goBtn').disabled = false;
}
$('goBtn').onclick = go;
inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

(async () => {
  const st = $('st');
  try {
    py = await loadPyodide(); st.textContent = 'Cargando SymPy…';
    await py.loadPackage('sympy');
    py.runPython(document.getElementById('pysrc').textContent);
    ready = true; $('goBtn').disabled = false;
    st.textContent = 'Motor listo'; st.className = 'text-xs font-semibold px-3 py-1 rounded-full bg-emerald-100 text-emerald-800';
  } catch (e) {
    st.textContent = 'No se pudo cargar el motor (¿sin conexión?)'; st.className = 'text-xs font-semibold px-3 py-1 rounded-full bg-rose-100 text-rose-800';
  }
})();
